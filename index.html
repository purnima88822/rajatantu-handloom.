<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAJATANTU | Woven in Heritage</title>

<style>
:root {
  --wine: #40151f;
  --gold: #c49a55;
  --cream: #fbf6ee;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cream);
  color: #2d2020;
  font-family: Georgia, "Times New Roman", serif;
}

header {
  background: var(--wine);
  color: white;
  text-align: center;
  padding: 25px 15px 20px;
  border-bottom: 4px solid var(--gold);
}

.brand {
  font-size: clamp(30px, 7vw, 52px);
  letter-spacing: 5px;
  margin: 0;
}

.tag {
  font: 11px Arial, sans-serif;
  letter-spacing: 4px;
  color: #e4c995;
  margin-top: 8px;
}

nav {
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  padding: 14px;
  background: #fffaf3;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
}

nav a {
  color: var(--wine);
  text-decoration: none;
}

.hero {
  max-width: 1200px;
  margin: 22px auto;
  padding: 0 16px;
}

.hero img {
  width: 100%;
  max-height: 440px;
  object-fit: cover;
  display: block;
  border: 1px solid #d9c49f;
}

.intro {
  text-align: center;
  padding: 20px 16px 12px;
}

.intro h1 {
  font-size: clamp(24px, 4vw, 36px);
  font-weight: normal;
  color: var(--wine);
  margin: 0 0 9px;
}

.intro p {
  font: 14px/1.7 Arial, sans-serif;
  color: #6d5a50;
  max-width: 650px;
  margin: auto;
}

.filters {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 18px;
}

.filters button {
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--wine);
  padding: 11px 20px;
  letter-spacing: 1px;
  cursor: pointer;
}

.filters button.active,
.filters button:hover {
  background: var(--wine);
  color: white;
}

.grid {
  max-width: 1200px;
  margin: 0 auto;
  padding: 8px 16px 50px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border: 1px solid #eadfce;
  padding: 9px;
  box-shadow: 0 4px 14px #4a25300d;
}

.card img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  display: block;
  background: #eee;
}

.card h3 {
  font-size: 16px;
  font-weight: normal;
  text-align: center;
  color: var(--wine);
  margin: 12px 4px 7px;
}

.price {
  font: bold 14px Arial, sans-serif;
  text-align: center;
  color: #9a7137;
  margin: 8px 0;
}

.card p {
  font: 11px Arial, sans-serif;
  text-align: center;
  letter-spacing: 1px;
  color: #92734a;
  margin: 0 0 8px;
}

footer {
  background: var(--wine);
  color: #f5e8d3;
  text-align: center;
  padding: 25px 15px;
  font: 12px/1.8 Arial, sans-serif;
  letter-spacing: 1px;
}

@media(max-width:850px) {
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .card img { height: 250px; }
}

@media(max-width:560px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding: 5px 10px 35px;
  }
  .card { padding: 6px; }
  .card img { height: 205px; }
  .brand { letter-spacing: 3px; }
}
</style>
</head>

<body>

<header>
  <h1 class="brand">RAJATANTU</h1>
  <div class="tag">WOVEN IN HERITAGE</div>
</header>

<nav>
  <a href="#home">HOME</a>
  <a href="#collection">COLLECTION</a>
  <a href="#contact">CONTACT</a>
</nav>

<section class="hero" id="home">
  <img src="rajatantu-banner.jpg" alt="Rajatantu handloom banner">
</section>

<section class="intro">
  <h1>Tradition, Woven Beautifully</h1>
  <p>
    Discover our handpicked collection of traditional dresses
    and sarees, celebrating timeless craftsmanship and heritage.
  </p>
</section>

<div class="filters" id="collection">
  <button class="active" data-filter="all">ALL (40)</button>
  <button data-filter="dress">DRESSES (10)</button>
  <button data-filter="saree">SAREES (30)</button>
</div>

<main class="grid" id="products"></main>

<footer id="contact">
  RAJATANTU<br>
  WOVEN IN HERITAGE<br>
  For product enquiries, please contact the store.
</footer>

<script>

// FIRST 10 IMAGES: DRESSES

const dresses = [
  "p01.jpg",
  "p04.jpg",
  "p05.jpg",
  "p07.jpg",
  "p08.jpg",
  "Screenshot_2026-11-06-14-04-57-617_com.miui.gallery.jpg",
  "Screenshot_2026-11-06-14-05-21-696_com.miui.gallery.jpg",
  "Screenshot_2026-11-06-14-05-26-487_com.miui.gallery.jpg",
  "Screenshot_2026-11-06-14-05-29-262_com.miui.gallery.jpg",
  "product-01.jpg"
];

// NEXT 30 IMAGES: SAREES

const sarees = [
  "IMG-20261105-WA0029.jpg",
  "IMG-20261105-WA0148.jpg",
  "IMG-20261105-WA0458.jpg",
  "IMG-20261105-WA0487.jpg",
  "IMG-20261105-WA0551.jpg",
  "IMG-20261105-WA0739.jpg",
  "IMG-20261105-WA2681.jpg",
  "IMG-20261105-WA2817.jpg",
  "IMG-20261105-WA3026.jpg",
  "IMG-20261105-WA3128.jpg",
  "IMG-20261105-WA3432.jpg",
  "IMG-20261105-WA3500.jpg",
  "IMG-20261105-WA3520.jpg",
  "IMG-20261105-WA3777.jpg",
  "IMG-20261105-WA4160.jpg",
  "IMG-20261105-WA4648.jpg",
  "IMG-20261105-WA4983.jpg",
  "IMG-20261105-WA5028.jpg",
  "IMG-20261105-WA5175.jpg",
  "IMG-20261105-WA5727.jpg",
  "IMG-20261105-WA6376.jpg",
  "IMG-20261105-WA6631.jpg",
  "IMG-20261105-WA6847.jpg",
  "IMG-20261105-WA6956.jpg",
  "IMG-20261105-WA7507.jpg",
  "IMG-20261105-WA7929.jpg",
  "IMG-20261105-WA9095.jpg",
  "IMG-20261105-WA9185.jpg",
  "IMG-20261105-WA9934.jpg",
  "IMG-20261105-WA9987.jpg"
];

const products = [
  ...dresses.map((file, i) => ({
    file,
    category: "dress",
    title: `Traditional Dress ${String(i + 1).padStart(2, "0")}`,
    price: "₹2,999 – ₹4,999"
  })),

  ...sarees.map((file, i) => ({
    file,
    category: "saree",
    title: `Handloom Saree ${String(i + 1).padStart(2, "0")}`,
    price: "₹8,999 – ₹29,999"
  }))
];

const container = document.getElementById("products");

function showProducts(filter = "all") {
  container.innerHTML = "";

  products
    .filter(product =>
      filter === "all" || product.category === filter
    )
    .forEach(product => {

      const card = document.createElement("article");
      card.className = "card";

      const img = document.createElement("img");
      img.src = product.file;
      img.alt = product.title;

      img.onerror = () => {
        img.style.display = "none";
      };

      const title = document.createElement("h3");
      title.textContent = product.title;

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = product.price;

      const label = document.createElement("p");
      label.textContent =
        product.category === "dress"
          ? "DRESS COLLECTION"
          : "SAREE COLLECTION";

      card.append(img, title, price, label);
      container.append(card);
    });
}

document.querySelectorAll(".filters button").forEach(button => {
  button.addEventListener("click", () => {

    document.querySelectorAll(".filters button")
      .forEach(item => item.classList.remove("active"));

    button.classList.add("active");
    showProducts(button.dataset.filter);
  });
});

showProducts();

</script>

</body>
</html>
